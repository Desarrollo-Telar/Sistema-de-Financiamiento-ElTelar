{% load static %}

<div class="section-header">
    <h2 class="section-title">
        <i class="fa-solid fa-shield-halved text-brand-red"></i> Registro de Garantías y Detalles
    </h2>
    <p class="section-subtitle">Complete la descripción general de Guarantees y los detalles específicos de
        DetailsGuarantees</p>
</div>

<!-- Parent Guarantee Form -->
<div class="glass-card card-padding mb-6 bg-white-70">
    <h3 class="card-subtitle mb-3">1. Garantía General (Cabecera Guarantees)</h3>
    <div class="grid-form">
        <div class="col-span-2">
            <label class="form-label">Descripción General de Garantía *</label>
            <input type="text" id="garantia_descripcion_general" class="glass-input"
                value="Garantías mixtas presentadas para respaldo de crédito productivo"
                placeholder="Ej: Hipoteca sobre inmueble y prenda de maquinaria agrícola...">
        </div>
        <div>
            <label class="form-label">Suma Total de Cobertura (Calculado)</label>
            <div class="input-relative">
                <span class="prefix-symbol">Q</span>
                <input type="text" id="suma_total_garantia" class="glass-input pl-symbol text-emerald font-bold"
                    value="0.00" readonly>
            </div>
        </div>
    </div>
</div>

<!-- Guarantee Details Item Form -->
<div class="glass-card card-padding bg-white-70">
    <h3 class="card-subtitle mb-3">2. Detalle de Garantía (DetailsGuarantees)</h3>

    <div class="grid-2-col mb-4">
        <div>
            <label class="form-label">Tipo de Garantía *</label>
            <select id="tipo_garantia" class="glass-input" onchange="renderDynamicGuaranteeFields()">
                <option selected value="0">------------</option>
                <option value="HIPOTECA">HIPOTECA</option>
                <option value="DERECHO DE POSESION HIPOTECA">DERECHO DE POSESION HIPOTECA</option>
                <option value="FIADOR">FIADOR</option>
                <option value="CHEQUE / PAGARE">CHEQUE / PAGARE</option>
                <option value="VEHICULO">VEHICULO</option>
                <option value="MOBILIARIA">MOBILIARIA</option>
            </select>
        </div>
        <div>
            <label class="form-label">Valor de Cobertura (Q) *</label>
            <div class="input-relative">
                <span class="prefix-symbol">Q</span>
                <input type="number" step="0.01" id="valor_cobertura" class="glass-input pl-symbol font-bold"
                    placeholder="0.00" required>
            </div>
        </div>
    </div>

    <!-- Dynamic JSON Fields Container -->
    <div class="dynamic-container mb-4">
        <h4 id="dynamic-json-title" class="section-title text-sm mb-3">
            <i class="fa-solid fa-code text-brand-red"></i> Especificaciones Personalizadas para JSONField
        </h4>
        <div id="dynamic-guarantee-fields" class="grid-form">
            <!-- Dynamic inputs injected by JS -->
        </div>
    </div>

    <div class="form-actions-right">
        <button type="button" onclick="addGuaranteeDetail()" class="btn-gradient-primary">
            <i class="fa-solid fa-plus"></i>
            <span>Agregar Detalle de Garantía</span>
        </button>
    </div>
</div>

<script type="module" src="{% static 'js/financings/credito/registro_garantias.js' %}"></script>
