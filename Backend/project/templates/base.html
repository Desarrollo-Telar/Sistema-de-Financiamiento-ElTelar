{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INVERSIONES INTEGRALES EL TELAR S.A. | {{title}}</title>
  <link rel="icon" href="{% static 'img/logo_icon.jpeg' %}" />
   <meta name="description" content="Un hilo de oportunidades.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

    
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/buttons.css' %}">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <link rel="stylesheet" href="{% static 'css/list.css' %}">
 
  <link rel="stylesheet" href="{% static 'css/new_styles.css' %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  {% block css %}
  {% endblock%}

</head>

<body>
  <div class="animated-bg"></div>
  {% include 'navbar.html' %}
  {% include 'navbar_respo.html' %}
  <main class="d-flex flex-nowrap">
    {% include 'sidebar_.html' %}
    <div class="container main-content">
      {% block content %}
      {% endblock %}
    </div>

  </main>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
    crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="{% static 'js/node_modules/sweetalert2/dist/sweetalert2.all.min.js' %}"></script>
  <script src="{% static 'js/node_modules/chart.js/dist/chart.umd.js' %}"></script>
  
  <script src="{% static 'js/node_modules/axios/dist/axios.min.js' %}"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="{% static 'js/sidebar.js'%}" class="astro-vvvwv3sm"></script>

  <script src="{% static 'js/style_css.js' %}"></script>

  <script>
    {% if messages %}
    {% for message in messages %}
    Swal.fire({
      icon: "{% if message.tags == 'success' %}success{% elif message.tags == 'error' %}error{% elif message.tags == 'warning' %}warning{% else %}info{% endif %}",
      title: "{{ message }}",
      timer: 5000,
      showConfirmButton: false,
    });
    {% endfor %}
    {% endif %}
  </script>
  <script>
    let cantidadNotificaciones = 0;

    function mostrarToaster(mensaje) {
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'info',
            title: mensaje,
            showConfirmButton: false,
            timer: 3000,
            timerProgressBar: true,
            didOpen: (toast) => {
                toast.addEventListener('mouseenter', Swal.stopTimer);
                toast.addEventListener('mouseleave', Swal.resumeTimer);
            }
        });
    }

    // ============================================================
    // CONFIGURACIÓN BASE
    // ============================================================

    function obtenerBaseUrl() {
        const protocolo = window.location.protocol;
        const dominio = window.location.hostname;
        const puerto = window.location.port;

        return `${protocolo}//${dominio}${puerto ? `:${puerto}` : ''}`;
    }


    // ============================================================
    // OBTENER CANTIDAD DE NOTIFICACIONES NO LEÍDAS
    // ============================================================

    async function cargarCantidadNotificaciones() {

        const badge = document.getElementById("noti-badge");

        if (!badge) {
            console.warn("No se encontró #noti-badge");
            return;
        }

        const baseUrl = obtenerBaseUrl();

        const url =
            `${baseUrl}/actividades/api/notificaciones/unread_count/`;

        try {

            const response = await fetch(url, {
                method: 'GET',
                credentials: 'include',
                headers: {
                    'Accept': 'application/json'
                }
            });

            if (!response.ok) {
                throw new Error(
                    `Error HTTP ${response.status}`
                );
            }

            const data = await response.json();

            console.log(
                "Cantidad de notificaciones:",
                data
            );

            const total = Number(data.unread_count || 0);


            // ----------------------------------------------------
            // ACTUALIZAR BADGE
            // ----------------------------------------------------

            badge.textContent =
                total > 99 ? "99+" : total;

            badge.style.display =
                total > 0 ? "inline-block" : "none";


            // ----------------------------------------------------
            // TOASTER
            // ----------------------------------------------------

            if (
                cantidadNotificaciones > 0 &&
                total > cantidadNotificaciones
            ) {

                const nuevas =
                    total - cantidadNotificaciones;

                mostrarToaster(
                    `Tienes ${nuevas} nueva(s) notificación(es).`
                );
            }

            cantidadNotificaciones = total;

        } catch (error) {

            console.error(
                "Error al cargar cantidad de notificaciones:",
                error
            );
        }
    }


    // ============================================================
    // CARGAR LAS ÚLTIMAS NOTIFICACIONES
    // ============================================================

    async function cargarUltimasNotificaciones() {

        const list =
            document.getElementById("notificaciones-list");

        if (!list) {
            console.warn(
                "No se encontró #notificaciones-list"
            );
            return;
        }

        const baseUrl = obtenerBaseUrl();

        /*
         * IMPORTANTE:
         *
         * Aquí debes utilizar el endpoint que devuelve
         * las notificaciones.
         *
         * NO debes utilizar unread_count porque ese endpoint
         * solamente devuelve el número.
         */

        const url =
            `${baseUrl}/actividades/api/notificaciones/`;


        try {

            const response = await fetch(url, {
                method: 'GET',
                credentials: 'include',
                headers: {
                    'Accept': 'application/json'
                }
            });


            if (!response.ok) {
                throw new Error(
                    `Error HTTP ${response.status}`
                );
            }


            const data = await response.json();

            console.log(
                "Notificaciones obtenidas:",
                data
            );


            // ----------------------------------------------------
            // SOPORTAR RESPUESTA PAGINADA O ARRAY
            // ----------------------------------------------------

            const listaNotificaciones =
                Array.isArray(data)
                    ? data
                    : (data.results || []);


            // ----------------------------------------------------
            // LIMPIAR LISTA
            // ----------------------------------------------------

            list.innerHTML = "";


            // ----------------------------------------------------
            // SIN NOTIFICACIONES
            // ----------------------------------------------------

            if (listaNotificaciones.length === 0) {

                list.innerHTML = `
                    <li>
                        <span class="dropdown-item fw-light">
                            No hay notificaciones.
                        </span>
                    </li>

                    <li>
                        <hr class="dropdown-divider">
                    </li>

                    <li>
                        <a
                            class="dropdown-item fw-italic"
                            href="{% url 'actividades:notification' %}">
                            Ver Todas las Notificaciones
                        </a>
                    </li>
                `;

                return;
            }


            // ----------------------------------------------------
            // MOSTRAR LAS ÚLTIMAS 5
            // ----------------------------------------------------

            listaNotificaciones
                .slice(0, 5)
                .forEach(noti => {

                    const item =
                        document.createElement("li");


                    const uuid =
                        noti.uuid || "";


                    const title =
                        noti.title || "Notificación";


                    const createdAt =
                        noti.created_at || "";


                    item.innerHTML = `
                        <a
                            class="dropdown-item"
                            href="${baseUrl}/actividades/notification/${uuid}/">

                            <span class="fw-semibold">
                                ${title}
                            </span>

                            <br>

                            <small class="fw-light text-muted">
                                ${createdAt}
                            </small>

                        </a>
                    `;


                    list.appendChild(item);

                });


            // ----------------------------------------------------
            // DIVISOR
            // ----------------------------------------------------

            const divider =
                document.createElement("li");

            divider.innerHTML =
                `<hr class="dropdown-divider">`;

            list.appendChild(divider);


            // ----------------------------------------------------
            // VER TODAS
            // ----------------------------------------------------

            const verMas =
                document.createElement("li");

            verMas.innerHTML = `
                <a
                    class="dropdown-item fw-italic"
                    href="{% url 'actividades:notification' %}">
                    Ver Todas las Notificaciones
                </a>
            `;

            list.appendChild(verMas);


        } catch (error) {

            console.error(
                "Error al cargar las notificaciones:",
                error
            );

            list.innerHTML = `
                <li>
                    <span class="dropdown-item text-danger">
                        No se pudieron cargar las notificaciones.
                    </span>
                </li>
            `;
        }
    }


    // ============================================================
    // INICIALIZACIÓN
    // ============================================================

    document.addEventListener(
        'DOMContentLoaded',
        () => {

            // Cargar contador
            cargarCantidadNotificaciones();

            // Cargar últimas notificaciones
            cargarUltimasNotificaciones();


            // ----------------------------------------------------
            // ACTUALIZAR CONTADOR CADA 45 SEGUNDOS
            // ----------------------------------------------------

            setInterval(
                cargarCantidadNotificaciones,
                45000
            );


            // ----------------------------------------------------
            // ACTUALIZAR LISTA AL ABRIR EL DROPDOWN
            // ----------------------------------------------------

            const dropdown =
                document.getElementById(
                    "notificaciones-dropdown"
                );

            if (dropdown) {

                dropdown.addEventListener(
                    "show.bs.dropdown",
                    () => {
                        cargarUltimasNotificaciones();
                    }
                );
            }

        }
    );

</script>

  {%block js%} {%endblock%}
</body>

</html>
